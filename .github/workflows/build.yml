name: build-apk

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: 安装编译所需 SDK 组件
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: 缓存 Gradle 依赖
        uses: gradle/actions/setup-gradle@v4

      - name: 构建 devDebug APK
        run: chmod +x ./gradlew && ./gradlew --no-daemon assembleDevDebug

      - name: 运行 JVM 单元测试
        run: ./gradlew --no-daemon testDevDebugUnitTest

      - name: 上传 APK（文件名含 commit sha）
        env:
          SHA: ${{ github.sha }}
        run: |
          mkdir -p artifacts
          for f in app/build/outputs/apk/dev/debug/*.apk; do
            cp "$f" "artifacts/$(basename "${f%.apk}")-${SHA:0:8}.apk"
          done

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: voicectl-dev-debug-${{ github.sha }}
          path: artifacts/*.apk
          retention-days: 14

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-${{ github.run_id }}-r${{ github.run_attempt }}
          name: devDebug #${{ github.run_number }} (${{ github.sha }})
          body: |
            ✅ 自动构建成功，已生成可安装的 devDebug APK。

            - Commit: `${{ github.sha }}`
            - Branch: `${{ github.ref_name }}`
            - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - APK: `app-dev-debug-${{ github.sha }}.apk`

            说明：该版本为自动构建的预发布包，TFLite 真实模型与声纹模板仍待集成。
          prerelease: true
          draft: false
          files: artifacts/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
